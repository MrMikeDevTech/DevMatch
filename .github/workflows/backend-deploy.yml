name: Backend CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Write env files
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          echo "$PROD_ENV" > .env
          echo "$PROD_ENV" > backend/.env

      - name: Build backend image
        run: docker compose -f docker-compose.prod.yml build backend

      - name: Deploy
        run: docker compose -f docker-compose.prod.yml up -d backend

      - name: Run pending migrations
        run: docker compose -f docker-compose.prod.yml exec -T backend bunx prisma migrate deploy --config prisma7.config.ts
